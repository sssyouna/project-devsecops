- apiVersion: kyverno.io/v1
  kind: ClusterPolicy
  metadata:
    annotations:
      policies.kyverno.io/category: Supply Chain
      policies.kyverno.io/description: Workloads explicitly marked with image-policy=digest
        must use image references containing a sha256 digest. The opt-in label preserves
        the offline lab's local tag-based images while allowing protected workloads
        to require immutable references.
      policies.kyverno.io/subject: Pod
      policies.kyverno.io/title: Immutable images for protected Project 5 workloads
    creationTimestamp: "2026-11-10T12:13:51Z"
    generation: 1
    name: project5-immutable-protected-images
    resourceVersion: "1583"
    uid: 8722b453-63c9-40fd-98c0-d208142259bb
  spec:
    admission: true
    background: true
    emitWarning: false
    rules:
    - match:
        any:
        - resources:
            kinds:
            - Pod
            selector:
              matchLabels:
                security.project5.io/image-policy: digest
      name: require-digests-on-protected-workloads
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        foreach:
        - list: request.object.spec.containers[]
          pattern:
            image: '*@sha256:*'
        - list: request.object.spec.initContainers[]
          pattern:
            image: '*@sha256:*'
        message: Protected Project 5 images must use immutable sha256 digest references.
    validationFailureAction: Audit
  status:
    autogen: {}
    conditions:
    - lastTransitionTime: "2026-11-10T12:13:52Z"
      message: Ready
      reason: Succeeded
      status: "True"
      type: Ready
    rulecount:
      generate: 0
      mutate: 0
      validate: 1
      verifyimages: 0
    validatingadmissionpolicy:
      generated: false
      message: skip generating ValidatingAdmissionPolicy for non CEL rules.
- apiVersion: kyverno.io/v1
  kind: ClusterPolicy
  metadata:
    annotations:
      policies.kyverno.io/category: Reliability
      policies.kyverno.io/description: Project 5 containers must declare CPU and memory
        requests and limits. This prevents future workload additions from bypassing
        the resource budget used by the constrained lab VM.
      policies.kyverno.io/subject: Pod
      policies.kyverno.io/title: Project 5 resource requirements
    creationTimestamp: "2026-11-10T12:13:51Z"
    generation: 1
    name: project5-resource-requirements
    resourceVersion: "1579"
    uid: 308d0117-84e4-4089-ac0d-70b9d6490b2e
  spec:
