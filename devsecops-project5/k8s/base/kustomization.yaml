apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - identity.yaml
  - config.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ../security
configMapGenerator:
  - name: database-init
    namespace: project5-data
    files: [bootstrap.sh]
  - name: database-access
    namespace: project5-data
    files: [pg_hba.conf, pg_ident.conf]
