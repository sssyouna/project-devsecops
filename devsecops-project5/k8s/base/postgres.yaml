apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: project5-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: project5-data
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-demo-export
          image: project5-postgres:17.6
          imagePullPolicy: Never
          command: [sh, -ec]
          args:
            - |
              umask 077
              mkdir -p /storage/pgdata /storage/exports
              if [ ! -f /storage/exports/fictional-payroll.csv ]; then
                printf 'employee,salary,classification\nDEMO-PERSON-001,12345,SYNTHETIC-ONLY\n' > /storage/exports/fictional-payroll.csv
              fi
              chmod 0700 /storage/pgdata /storage/exports
              chmod 0600 /storage/exports/fictional-payroll.csv
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: data, mountPath: /storage}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
      containers:
        - name: postgres
          image: project5-postgres:17.6
          imagePullPolicy: Never
          args: [-c, hba_file=/etc/postgresql/security/pg_hba.conf, -c, ident_file=/etc/postgresql/security/pg_ident.conf]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          env:
            - {name: POSTGRES_USER, value: lab_admin}
            - {name: POSTGRES_DB, value: inventory}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_INITDB_ARGS, value: '--auth-local=peer --auth-host=scram-sha-256'}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: database-bootstrap, key: admin-password}
            - name: INVENTORY_APP_PASSWORD
              valueFrom:
                secretKeyRef: {name: database-bootstrap, key: app-password}
          ports:
            - {name: postgres, containerPort: 5432}
          startupProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tmp, mountPath: /tmp}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: bootstrap, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: database-access, mountPath: /etc/postgresql/security, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: socket
          emptyDir: {sizeLimit: 8Mi}
        - name: bootstrap
          configMap: {name: database-init, defaultMode: 0444}
        - name: database-access
          configMap: {name: database-access, defaultMode: 0444}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: project5-data
spec:
  type: ClusterIP
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
