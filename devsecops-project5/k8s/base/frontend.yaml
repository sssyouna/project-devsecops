apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      serviceAccountName: shared-workload
      containers:
        - name: frontend
          image: project5-frontend:phase1
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector: {app: frontend}
  ports:
    - {name: http, port: 8080, targetPort: http}
